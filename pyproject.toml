[project]
name = "gearbox-assembly-dev"
version = "0.0.0"
description = "Gearbox Assembly Challenge (AAAI 2026) development environment"
requires-python = ">=3.11,<3.12"
dependencies = [
    "galaxea_lab_external",
    "isaaclab",
    "isaaclab_assets",
    "isaaclab_tasks",
    "isaaclab_rl[skrl]",
    "isaaclab_mimic",
    # Isaac Sim is NOT installed via pip. It is provided by the system-installed
    # binary at $ISAAC_SIM_PATH (default /home/hliu/isaac-sim-5.1). Activate with
    # `source scripts/env.sh` before running anything that touches isaacsim/omni.
    "torch==2.7.0",
    "torchvision==0.22.0",
    "torchaudio==2.7.0",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
build-constraint-dependencies = ["setuptools<81", "wheel<0.46"]
reinstall-package = ["galaxea_lab_external"]
override-dependencies = [
    "pywin32==306 ; sys_platform == 'win32'",
    "starlette==0.49.1",
    # On Windows, h5py and Isaac Sim's RTX sensors extension both ship hdf5.dll
    # and Windows resolves DLLs by name (first-loaded wins, no RPATH). Pin h5py
    # to a release whose bundled HDF5 ABI matches Isaac Sim 5.1's bundled HDF5
    # 1.14.6 — h5py 3.14.0 ships HDF5 1.14.6. Without this, importing h5py
    # after Kit boots fails with "DLL load failed while importing _errors:
    # The specified procedure could not be found", and preloading h5py first
    # breaks isaacsim.sensors.rtx (HDF5 2.0.0 vs 1.14.6 ABI mismatch).
    "h5py==3.14.0 ; sys_platform == 'win32'",
]

[tool.uv.sources]
galaxea_lab_external = { path = "source/Galaxea_Lab_External", editable = true }
isaaclab = { path = "IsaacLab/source/isaaclab", editable = true }
isaaclab_assets = { path = "IsaacLab/source/isaaclab_assets", editable = true }
isaaclab_tasks = { path = "IsaacLab/source/isaaclab_tasks", editable = true }
isaaclab_rl = { path = "IsaacLab/source/isaaclab_rl", editable = true }
isaaclab_mimic = { path = "IsaacLab/source/isaaclab_mimic", editable = true }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
