[project]
name = "gearbox-assembly-dev"
version = "0.0.0"
description = "Gearbox Assembly Challenge (AAAI 2026) development environment"
requires-python = ">=3.11,<3.12"
dependencies = [
    "galaxea_lab_external",
    "isaaclab",
    "isaaclab_assets",
    "isaaclab_tasks",
    "isaaclab_rl[skrl]",
    "isaaclab_mimic",
    # Isaac Sim is NOT installed via pip. It is provided by the system-installed
    # binary at $ISAAC_SIM_PATH (default /home/liuj/isaac-sim-5.1). Activate with
    # `source scripts/env.sh` before running anything that touches isaacsim/omni.
    "torch==2.7.0",
    "torchvision==0.22.0",
    "torchaudio==2.7.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
build-constraint-dependencies = ["setuptools<81", "wheel<0.46"]
reinstall-package = ["galaxea_lab_external"]
override-dependencies = [
    "pywin32==306 ; sys_platform == 'win32'",
    "starlette==0.49.1",
]

[tool.uv.sources]
galaxea_lab_external = { path = "source/Galaxea_Lab_External", editable = true }
isaaclab = { path = "IsaacLab/source/isaaclab", editable = true }
isaaclab_assets = { path = "IsaacLab/source/isaaclab_assets", editable = true }
isaaclab_tasks = { path = "IsaacLab/source/isaaclab_tasks", editable = true }
isaaclab_rl = { path = "IsaacLab/source/isaaclab_rl", editable = true }
isaaclab_mimic = { path = "IsaacLab/source/isaaclab_mimic", editable = true }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
